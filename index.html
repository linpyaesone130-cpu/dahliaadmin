<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>PCA Admin Panel</title>
<meta name="theme-color" content="#0066ff"/><meta name="apple-mobile-web-app-capable" content="yes"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#f0f5fb;--sf:#ffffff;--sf2:#eaf0f8;--sf3:#dde8f4;--bd:#c8d8ea;--bd2:#b0c8de;
  --tx:#0d1e30;--tx2:#3a5470;--tx3:#6a8aa0;
  --ac:#0066ff;--ac2:#2979ff;--ac3:rgba(0,102,255,.15);
  --blu:#0066ff;--blu2:#2979ff;
  --gn:#00b05c;--yw:#f0a500;--rd:#e53935;--pur:#7b68ee;
  --grad:linear-gradient(135deg,#0066ff 0%,#2979ff 100%);
  --r:14px;--f:'Barlow','Inter',system-ui,sans-serif;--m:'JetBrains Mono',monospace;
  --glass:rgba(255,255,255,.9);--glow:0 0 20px rgba(0,102,255,.2)
}
*{margin:0;padding:0;box-sizing:border-box}::-webkit-scrollbar{display:none}
body{font-family:var(--f);background:var(--bg);color:var(--tx);display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative}
/* Auth screens */
.auth-sc{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.auth-logo{width:72px;height:72px;border-radius:22px;background:var(--grad);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 0 32px rgba(0,102,255,.35),0 0 0 1px rgba(0,102,255,.2)}
.auth-logo svg{width:30px;height:30px;fill:#fff}
.auth-title{font-size:22px;font-weight:900;text-transform:uppercase;text-align:center;letter-spacing:.5px}.auth-title span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-sub{font-size:12px;color:var(--tx3);text-align:center;margin-top:3px}
.auth-card{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:24px;margin-top:22px;box-shadow:0 8px 32px rgba(0,102,255,.1)}
.fg{margin-bottom:14px}.fg label{display:block;font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--bd);background:var(--sf2);font-size:14px;font-family:var(--f);color:var(--tx);outline:none;transition:.2s}
.fg input:focus,.fg select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(44,165,224,.12)}
.fg textarea{resize:vertical;min-height:50px;font-family:var(--f)}
.fg .pw-wrap{position:relative}.fg .pw-wrap input{padding-right:44px}
.fg .pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx3)}.fg .pw-eye svg{width:18px;height:18px;stroke:currentColor;fill:none}
.fg .rw{display:flex;gap:8px}.fg .rw>*{flex:1;min-width:0}
.btn-main{width:100%;padding:14px;border-radius:var(--r);border:none;font-size:14px;font-weight:800;cursor:pointer;font-family:var(--f);text-transform:uppercase;letter-spacing:.5px;color:#fff;transition:.15s}.btn-main:active{transform:scale(.97)}
.btn-main.orange{background:var(--grad);box-shadow:0 4px 20px rgba(0,102,255,.35)}
.btn-main.green{background:linear-gradient(135deg,#00b05c,#00d672);box-shadow:0 4px 16px rgba(0,176,92,.25)}
.auth-err{font-size:11px;color:var(--rd);font-weight:600;text-align:center;margin-top:10px;min-height:15px}
.auth-link{display:block;text-align:center;margin-top:12px;font-size:11px;color:var(--tx3);font-weight:600;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:var(--f)}
.auth-hint{margin-top:14px;padding:10px;background:var(--sf2);border-radius:var(--r);border:1px solid var(--bd);font-size:10px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.auth-hint svg{width:14px;height:14px;stroke:currentColor;fill:none;flex-shrink:0}
/* OTP Boxes */
.otp-row{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.otp-in{width:44px;height:56px;text-align:center;font-size:24px;font-weight:900;border-radius:var(--r);border:1.5px solid var(--bd);background:var(--sf2);outline:none;font-family:var(--f);transition:.2s;color:var(--tx)}
.otp-in:focus{border-color:var(--gn);box-shadow:0 0 0 3px rgba(0,176,92,.12)}
.otp-sep{display:flex;align-items:center;font-size:18px;color:var(--bd);font-weight:700}
/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:40;backdrop-filter:blur(20px);box-shadow:0 1px 0 var(--bd),0 4px 20px rgba(0,102,255,.08)}
.hdr-logo{display:flex;align-items:center;gap:9px}.hdr-logo .mark{width:32px;height:32px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:var(--glow)}.hdr-logo .mark svg{width:16px;height:16px;fill:#fff}.hdr-logo .nm{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}.hdr-logo .nm span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-r{display:flex;align-items:center;gap:6px}
.cur-sw{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--sf2)}.cur-b{padding:5px 9px;font-size:9px;font-weight:800;border:none;cursor:pointer;font-family:var(--f);transition:.15s;background:transparent;color:var(--tx3)}.cur-b.on{background:var(--ac);color:#fff}
.av{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;box-shadow:var(--glow)}
/* Firebase bar */
.fb-bar{display:flex;align-items:center;justify-content:center;gap:5px;padding:5px;font-size:9px;font-weight:700;background:rgba(0,102,255,.06);border-bottom:1px solid var(--bd);color:var(--tx3)}.fb-bar .dot{width:6px;height:6px;border-radius:50%}
/* Content */
.cnt{padding:14px 14px 100px}
.pg{display:none;animation:fi .25s}.pg.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}
/* Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.97);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom,6px)+10px);z-index:40;backdrop-filter:blur(20px);box-shadow:0 -1px 0 var(--bd),0 -8px 32px rgba(0,102,255,.08)}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 10px;border:none;background:none;cursor:pointer;border-radius:12px;font-family:var(--f);transition:all .18s;position:relative;min-width:48px;}.nb:active{transform:scale(.88)}.nb svg{width:20px;height:20px;stroke:var(--tx3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:all .18s;}.nb .nl{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.3px;transition:all .18s;}
.nb.on{background:rgba(0,102,255,.12);}.nb.on svg{stroke:var(--ac);}.nb.on .nl{color:var(--ac);}
.nb .bdg{position:absolute;top:3px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--rd);color:#fff;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid rgba(255,255,255,.97)}
/* Cards */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.scard{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;transition:all .2s;}.scard:hover{box-shadow:0 4px 20px rgba(0,102,255,.12);border-color:var(--bd2);}
.scard .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}.scard .ic svg{width:20px;height:20px;fill:none;stroke-width:1.7;stroke-linecap:round;}
.scard .lb{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;}.scard .vl{font-size:22px;font-weight:900;margin-top:3px;font-family:var(--m);}
/* Status bars */
.st-bars{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;}.st-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;}.st-bar:last-child{margin:0}.st-bar .sb-lb{font-size:10px;font-weight:700;width:60px;color:var(--tx2);}.st-bar .sb-wrap{flex:1;height:22px;background:var(--sf2);border-radius:7px;overflow:hidden;}.st-bar .sb-fill{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;transition:width .6s cubic-bezier(.34,1.56,.64,1);}.st-bar .sb-val{font-size:9px;font-weight:800;color:#fff;}
/* Wrap card */
.cw{background:var(--sf);border:1px solid var(--bd);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,102,255,.08);}
.cw-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:6px;background:var(--sf);}
.cw-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:6px;color:var(--tx);}.cw-t svg{width:14px;height:14px;stroke:var(--ac2);fill:none;stroke-width:1.7;}
/* List items */
.li{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.06);transition:background .12s;}.li:last-child{border:none;}.li:active{background:rgba(0,102,255,.06);}
.li-i{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden;}.li-i img{width:100%;height:100%;object-fit:cover;}
.li-b{flex:1;min-width:0;}.li-t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.li-s{font-size:10px;color:var(--tx3);margin-top:2px;}
.li-r{text-align:right;flex-shrink:0;}.li-v{font-size:12px;font-weight:800;font-family:var(--m);color:var(--tx);}.li-d{font-size:9px;color:var(--tx3);}
.emp{text-align:center;padding:32px;color:var(--tx3);font-size:12px;font-weight:600;}
/* Badges */
.bg{padding:3px 8px;border-radius:6px;font-size:9px;font-weight:700;text-transform:uppercase;display:inline-flex;letter-spacing:.2px;}.bg.su{background:rgba(0,176,92,.12);color:var(--gn);border:1px solid rgba(0,176,92,.2);}.bg.pe{background:rgba(240,165,0,.1);color:var(--yw);border:1px solid rgba(240,165,0,.2);}.bg.fa{background:rgba(229,57,53,.1);color:var(--rd);border:1px solid rgba(229,57,53,.2);}
/* Buttons */
.bt{padding:6px 12px;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--f);border:1.5px solid var(--bd);background:var(--sf2);color:var(--tx2);display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap;}.bt:active{transform:scale(.94);opacity:.85;}.bt svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;}
.bt.pr{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 2px 10px rgba(0,102,255,.3);}.bt.gn{background:var(--gn);color:#fff;border-color:var(--gn);box-shadow:0 2px 8px rgba(0,176,92,.2);}.bt.yw{background:var(--yw);color:#fff;border-color:var(--yw);}.bt.rd{background:var(--rd);color:#fff;border-color:var(--rd);}.bt.bl{background:var(--ac);color:#fff;border-color:var(--ac);}
.act{display:flex;gap:4px;}.ab{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--bd);background:var(--sf2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}.ab:active{transform:scale(.88);}.ab svg{width:14px;height:14px;fill:none;stroke-width:1.7;}
/* Section label */
.sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px;display:flex;align-items:center;gap:6px;color:var(--tx2);}.sec svg{width:13px;height:13px;stroke:var(--ac);fill:none;}
/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.2s;}.mo.on{opacity:1;pointer-events:all;}
.mc{background:var(--sf);border-radius:22px 22px 0 0;padding:8px 18px 28px;max-width:430px;width:100%;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1,.64,1);max-height:90vh;overflow-y:auto;border-top:1px solid var(--bd2);}.mo.on .mc{transform:translateY(0);}
.m-handle{width:40px;height:4px;border-radius:4px;background:var(--bd2);margin:0 auto 16px;}
.mt{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}.mt h3{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.3px;}
.mx{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--bd);background:var(--sf2);cursor:pointer;display:flex;align-items:center;justify-content:center;}.mx svg{width:13px;height:13px;stroke:var(--tx2);fill:none;stroke-width:2;}
.mf{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd);}.mb{flex:1;padding:13px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:var(--f);border:none;text-transform:uppercase;letter-spacing:.3px;transition:all .15s;}.mb:active{transform:scale(.96);}.mb.sv{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(0,102,255,.25);}.mb.cn{background:var(--sf2);color:var(--tx2);border:1.5px solid var(--bd);}.mb.dl{background:var(--rd);color:#fff;}
/* Info rows */
.mr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06);}.mr:last-child{border:none;}.mr .ml{font-size:11px;color:var(--tx3);font-weight:600;}.mr .mv{font-size:12px;font-weight:700;color:var(--tx);}
/* Image upload */
.img-up{width:100%;height:100px;border:2px dashed var(--bd);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--sf2);overflow:hidden;position:relative;transition:border-color .15s;}.img-up:active{border-color:var(--ac);}.img-up img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}.img-up svg{width:24px;height:24px;stroke:var(--tx3);fill:none;}.img-up span{font-size:10px;color:var(--tx3);font-weight:600;margin-top:4px;}
/* Package list */
.pkl{display:flex;flex-direction:column;gap:6px;margin-top:6px;}.pkr{display:flex;gap:6px;align-items:center;}.pkr input{flex:1;padding:9px 10px;border-radius:9px;border:1.5px solid var(--bd);background:var(--sf2);font-size:12px;font-family:var(--f);color:var(--tx);outline:none;transition:border-color .15s;}.pkr input:focus{border-color:var(--ac);}.pkrm{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--bd);background:none;cursor:pointer;color:var(--rd);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;}
.pka{width:100%;padding:9px;border-radius:9px;border:1.5px dashed var(--bd);background:none;cursor:pointer;font-size:11px;font-weight:700;color:var(--ac);font-family:var(--f);margin-top:4px;text-align:center;transition:all .15s;}.pka:hover{background:rgba(0,102,255,.06);border-color:var(--ac);}
/* Settings */
.stc{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;}
.stc-t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:5px;color:var(--ac);}.stc-t svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;}
.str{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06);flex-wrap:wrap;gap:4px;}.str:last-child{border:none;}
.stl{font-size:12px;font-weight:700;color:var(--tx);}.sts{font-size:9px;color:var(--tx3);}
.sti{padding:8px 12px;border-radius:9px;border:1.5px solid var(--bd);font-size:12px;font-family:var(--f);color:var(--tx);outline:none;background:var(--sf2);width:100%;transition:border-color .15s;}.sti:focus{border-color:var(--ac);}
.tgl{position:relative;width:40px;height:22px;cursor:pointer;flex-shrink:0;}.tgl input{opacity:0;width:0;height:0;}.tgl .ts{position:absolute;inset:0;background:var(--bd);border-radius:22px;transition:.3s;}.tgl .ts::before{content:'';position:absolute;left:2px;bottom:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.3);}.tgl input:checked+.ts{background:var(--ac);}.tgl input:checked+.ts::before{transform:translateX(18px);}
/* Receipt */
.rcp-img{width:100%;border-radius:10px;border:1px solid var(--bd);overflow:hidden;margin:8px 0;}.rcp-img img{width:100%;display:block;}
.rcp-none{padding:14px;text-align:center;color:var(--tx3);font-size:11px;background:var(--sf2);border-radius:10px;border:1.5px dashed var(--bd);margin:8px 0;}
/* Toast */
.tst{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-12px);padding:12px 20px;border-radius:14px;font-size:12px;font-weight:700;z-index:200;opacity:0;transition:.3s;box-shadow:0 8px 40px rgba(0,0,0,.4);max-width:90%;display:flex;align-items:center;gap:8px;backdrop-filter:blur(12px);}.tst.v{opacity:1;transform:translateX(-50%) translateY(0);}.tst.ok{background:var(--gn);color:#fff;}.tst.er{background:var(--rd);color:#fff;}.tst.in{background:var(--ac);color:#fff;}
/* QR Section */
.qr-wrap{display:flex;justify-content:center;margin:10px 0;}.qr-wrap img{width:160px;height:160px;border-radius:14px;border:1px solid var(--bd);box-shadow:0 4px 20px rgba(0,102,255,.12);}
.secret-row{display:flex;gap:6px;align-items:center;margin:8px 0;}.secret-row code{flex:1;padding:9px 12px;background:var(--sf2);border-radius:9px;font-size:11px;font-family:var(--m);font-weight:700;color:var(--ac);user-select:all;border:1px solid var(--bd);}
/* PWA */
.pwa-btn{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--bd2);background:rgba(0,102,255,.08);color:var(--ac);font-size:12px;font-weight:800;cursor:pointer;font-family:var(--f);text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;transition:all .15s;}.pwa-btn:active{transform:scale(.96);}.pwa-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;}
/* Shimmer for loading states */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
/* Grid card image — full 100% cover, no emoji fallback */
.grid-card-img{width:100%;height:100%;object-fit:cover;object-position:center;position:absolute;inset:0;opacity:0;transition:opacity .3s;display:block}
.grid-card-img.loaded{opacity:1}
/* Generic img inside grid aspect-ratio containers */
div[style*="aspect-ratio"] img,.grid-card-img{object-fit:cover;object-position:center}
.grid-card-skel{width:100%;height:100%;position:absolute;inset:0;background:linear-gradient(90deg,var(--sf2) 25%,var(--sf3) 50%,var(--sf2) 75%);background-size:400px 100%;animation:shimmer 1.4s infinite}
/* Warning Dialog */
.warn-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s;padding:20px;}
.warn-ov.on{opacity:1;pointer-events:all;}
.warn-box{background:var(--sf);border-radius:22px;padding:26px 22px;width:100%;max-width:300px;text-align:center;transform:scale(.88);transition:transform .25s cubic-bezier(.34,1.2,.64,1);box-shadow:0 24px 60px rgba(0,102,255,.15);border:1px solid var(--bd);}
.warn-ov.on .warn-box{transform:scale(1);}
.warn-ic{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;}
.warn-ic.red{background:rgba(229,57,53,.12);} .warn-ic.blue{background:rgba(44,165,224,.1);}
.warn-ic svg{width:26px;height:26px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}

<script>
var FC={apiKey:"AIzaSyCRq3M1hclmBnqClfQrmv8WGE6-hth0Zr0",authDomain:"dahliagametopupstore-9d3fd.firebaseapp.com",projectId:"dahliagametopupstore-9d3fd",storageBucket:"dahliagametopupstore-9d3fd.appspot.com",messagingSenderId:"110787045948",appId:"1:110787045948:web:e46ed650774c0f6128f139"};
var db=null,fb=false,adAuth=null;
if(typeof firebase!=='undefined'){try{firebase.initializeApp(FC);db=firebase.firestore();adAuth=firebase.auth();adAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});fb=true;}catch(e){fb=false;}}

// Password eye toggle
function togglePw(id,btn){var i=document.getElementById(id);if(i.type==="password"){i.type="text";btn.innerHTML='<svg viewBox="0 0 24 24" stroke-width="1.8" style="width:18px;height:18px;stroke:var(--ac);fill:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';}else{i.type="password";btn.innerHTML='<svg viewBox="0 0 24 24" stroke-width="1.8" style="width:18px;height:18px;stroke:var(--tx3);fill:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';}}

// Quick login buttons
function quickLogin(name){document.getElementById("adEm").value=name;document.getElementById("adPw").value="PCA280823";adLogin();}

// Local admin credentials (Firebase Auth မလိုဘဲ login ဝင်နိုင်)
var ADMINS={
  "PCA28":   "PCA280823",
  "Raycod28":"PCA280823",
  "pca28":   "PCA280823",
  "raycod28":"PCA280823"
};
var _localLoginUser=null; // local login ဖြစ်ကြောင်း မှတ်ထားတဲ့ flag
function adLogin(){
  var raw=document.getElementById("adEm").value.trim();
  var pw=document.getElementById("adPw").value;
  var err=document.getElementById("adErr");
  if(!raw||!pw){err.textContent="Username & password required";return;}

  // ── Local check (ပထမဆုံး) ──────────────────────────
  if(ADMINS[raw]!==undefined){
    if(ADMINS[raw]===pw){
      err.textContent="";
      _localLoginUser=raw; // local login username မှတ်ထား
      check2FA();
      return;
    } else {
      err.textContent="Wrong password";
      return;
    }
  }

  // ── Firebase Auth fallback (Google account login) ──
  if(!adAuth){err.textContent="Account not found";return;}
  var em=raw;if(em.indexOf("@")===-1)em=raw.toLowerCase()+"@gmail.com";
  err.textContent="Signing in...";
  adAuth.signInWithEmailAndPassword(em,pw)
    .then(function(r){err.textContent="";_localLoginUser=null;check2FA();})
    .catch(function(e){
      var m=e.code==="auth/user-not-found"?"Account not found":
             e.code==="auth/wrong-password"?"Wrong password":
             e.code==="auth/invalid-email"?"Invalid username":
             "Login failed";
      err.textContent=m;
    });
}
// Auth state: Firebase persistent login — local login နဲ့ conflict မဖြစ်အောင် စစ်
if(adAuth){
  adAuth.onAuthStateChanged(function(u){
    if(u && !window._adminInited && !_localLoginUser){
      // Firebase persistent session နဲ့သာ auto-enter (local login မဟုတ်ရင်)
      enterDash(u);
    }
  });
}
document.addEventListener("keydown",function(e){if(e.key==="Enter"){if(document.getElementById("adminAuth").style.display!=="none")adLogin();if(document.getElementById("twoFaScreen").style.display!=="none")verify2FA();}});

// 2FA
var TOTP_SECRET="",twoFaEnabled=false;
function check2FA(){
  if(!fb||!db){enterDash();return;}
  var done=false;
  // Firestore silently hang ဖြစ်ရင် 3s timeout နဲ့ enterDash() ဝင်
  var t=setTimeout(function(){if(!done){done=true;enterDash();}},3000);
  db.collection("config").doc("2fa").get().then(function(d){
    if(done)return;done=true;clearTimeout(t);
    if(d.exists&&d.data().enabled&&d.data().secret){
      TOTP_SECRET=d.data().secret;twoFaEnabled=true;
      document.getElementById("adminAuth").style.display="none";
      document.getElementById("twoFaScreen").style.display="flex";
      document.querySelectorAll(".otp-in")[0].focus();
    }else{enterDash();}
  }).catch(function(){if(!done){done=true;clearTimeout(t);enterDash();}});
}
function enterDash(user){
  document.getElementById("adminAuth").style.display="none";
  document.getElementById("twoFaScreen").style.display="none";
  document.getElementById("adminApp").style.display="block";
  // Local login ဆိုရင် username ကိုသုံး၊ Firebase login ဆိုရင် email ကိုသုံး
  var who=_localLoginUser||
          (user&&user.email?user.email.split("@")[0]:null)||
          (adAuth&&adAuth.currentUser&&adAuth.currentUser.email?adAuth.currentUser.email.split("@")[0]:null)||
          "Admin";
  document.querySelector(".av").textContent=who.substring(0,2).toUpperCase();
  toast("Welcome, "+who+"!","ok");
  if(!window._adminInited){
    window._adminInited=true;
    init();
  } else {
    rDash();

// Canvas API ကိုသုံးပြီး ပုံကို 100KB အောက် compress လုပ်ပြီးမှ upload တင်သည်
// maxSizeKB  — target file size (default 100KB)
// maxWidthPx — max dimension (default 1200px) — quality မကျစေဘဲ resolution ကို ချ
function compressImage(file, maxSizeKB, maxWidthPx, callback) {
  maxSizeKB  = maxSizeKB  || 100;
  maxWidthPx = maxWidthPx || 1200;

  // ဖိုင် 5MB အထက်ဆို reject
  if (file.size > 5 * 1024 * 1024) { toast("ပုံ 5MB အောက်သာ ရွေးပါ","er"); return; }

  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      // 1) Resolution scale ချ (width/height ကန့်သတ်)
      var w = img.width, h = img.height;
      if (w > maxWidthPx) { h = Math.round(h * maxWidthPx / w); w = maxWidthPx; }
      if (h > maxWidthPx) { w = Math.round(w * maxWidthPx / h); h = maxWidthPx; }

      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);

      // 2) Quality ကို iterative ဆင်းသွားပြီး target size အောက်ရောက်မှ ရပ်
      var quality = 0.85;
      var result  = canvas.toDataURL("image/jpeg", quality);

      function tryCompress() {
        var sizeKB = Math.round((result.length * 3) / 4 / 1024);
        if (sizeKB <= maxSizeKB || quality <= 0.15) {
          // compress ပြီး — size info ပြပြီး callback ခေါ်
          var finalKB = Math.round((result.length * 3) / 4 / 1024);
          toast(finalKB + "KB (compressed)", "ok");
          callback(result);
        } else {
          quality = Math.max(quality - 0.10, 0.15);
          result  = canvas.toDataURL("image/jpeg", quality);
          tryCompress();
        }
      }
      tryCompress();
    };
    img.onerror = function() { toast("ပုံဖတ်မရပါ","er"); };
    img.src = e.target.result;
  };
  reader.onerror = function() { toast("ဖိုင်ဖတ်မရပါ","er"); };
  reader.readAsDataURL(file);
}

var usrSearch="";
function rUsers(){
  // ── 1. Build map from Orders ───────────────────────────────
  var um={};
  O.forEach(function(o){
    var u=o.authUser||"__guest__";
    if(!um[u]){
      um[u]=u==="__guest__"
        ?{id:"__guest__",did:"",nm:"Guest",uid:"",cnt:0,sp:0,last:"",games:{},gameIds:[],method:"guest",avatar:"",registered:false,icon:""}
        :{id:u,did:o.pcaId||"",nm:o.authName||"",uid:"",cnt:0,sp:0,last:o.timestamp||"",games:{},gameIds:[],method:o.loginMethod||"",avatar:"",registered:false,icon:""};
    }
    um[u].cnt++;
    if(o.status==="confirmed"||o.status==="success")um[u].sp+=o.price;
    um[u].games[o.game]=1;
    if(o.userId&&um[u].gameIds.indexOf(o.userId)===-1)um[u].gameIds.push(o.userId);
    if(o.timestamp&&o.timestamp>um[u].last)um[u].last=o.timestamp;
    if(o.pcaId&&u!=="__guest__")um[u].did=o.pcaId;
    if(o.authName&&u!=="__guest__")um[u].nm=o.authName;
  });

  // ── 2. Merge Firebase users (registered) into map ─────────
  USERS.forEach(function(fu){
    var key=fu.email||fu._docId||fu.uid||"";
    if(!key)return;
    if(!um[key]){
      um[key]={id:key,did:fu.pcaId||"",nm:fu.displayName||fu.name||fu.authName||"",uid:fu.uid||"",cnt:0,sp:0,last:fu.lastSeen||fu.joined||"",games:{},gameIds:[],method:fu.loginMethod||"",avatar:fu.avatar||fu.photoURL||fu.profileIcon||"",registered:true,icon:fu.profileIcon||fu.avatar||fu.photoURL||""};
    } else {
      // Enrich existing entry with Firebase data
      if(!um[key].avatar&&(fu.avatar||fu.photoURL||fu.profileIcon))um[key].avatar=fu.avatar||fu.photoURL||fu.profileIcon;
      if(!um[key].icon&&fu.profileIcon)um[key].icon=fu.profileIcon;
      if(!um[key].did&&fu.pcaId)um[key].did=fu.pcaId;
      if(!um[key].nm&&(fu.displayName||fu.name))um[key].nm=fu.displayName||fu.name;
      if(fu.loginMethod)um[key].method=fu.loginMethod;
      um[key].registered=true;
    }
  });

  // ── 3. Always show Guest placeholder ──────────────────────
  if(!um["__guest__"])um["__guest__"]={id:"__guest__",did:"",nm:"Guest",uid:"",cnt:0,sp:0,last:"",games:{},gameIds:[],method:"guest",avatar:"",registered:false,icon:""};

  // ── 4. Sort: registered first, then by spend, guest last ──
  var ul=Object.values(um).sort(function(a,b){
    if(a.id==="__guest__")return 1;
    if(b.id==="__guest__")return -1;
    if(b.registered!==a.registered)return b.registered?1:-1;
    return b.sp-a.sp;
  });

  if(usrSearch){var q=usrSearch.toLowerCase();ul=ul.filter(function(u){return u.id.toLowerCase().indexOf(q)>=0||u.did.toLowerCase().indexOf(q)>=0||u.nm.toLowerCase().indexOf(q)>=0;});}

  var h='<div class="cw"><div class="cw-h"><div class="cw-t" style="display:flex;align-items:center;gap:6px"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:var(--ac2);fill:none;stroke-width:1.7"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.87"/></svg>Users <span style="color:var(--tx3);font-weight:600">('+ul.length+')</span></div>'
    +'<div style="display:flex;align-items:center;gap:6px;font-size:9px;color:var(--tx3);font-weight:700"><span style="width:7px;height:7px;border-radius:50%;background:var(--gn);display:inline-block;box-shadow:0 0 5px var(--gn)"></span>'+USERS.length+' Registered</div></div>'
    +'<div style="padding:8px 10px;border-bottom:1px solid var(--bd)"><input style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--sf2);font-size:11px;font-family:var(--f);outline:none" placeholder="Search ID, name, email..." value="'+usrSearch+'" oninput="usrSearch=this.value;rUsers()"/></div>';

  h+=ul.map(function(u){
    var isGuest=u.id==="__guest__";
    var isReg=u.registered&&!isGuest;
    var isGoogle=u.method==="google.com";

    // ── Avatar: real icon/photo > initials > guest icon ──
    var avatarHtml;

    } else if(isGuest){
      avatarHtml='<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--tx3);fill:none;stroke-width:1.7"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

// AI RECEIPT VERIFICATION ENGINE
// Uses Claude Vision API to extract and verify receipt data
// ═══════════════════════════════════════════════════════
var AI_KEY=""; // Set in Settings → Groq API Key

// ═══ GROQ API — Free, Myanmar မှ block မခံ ═══
var GROQ_MODELS=[
  "meta-llama/llama-4-scout-17b-16e-instruct",
  "llama-3.2-11b-vision-preview",
  "llama-3.2-90b-vision-preview"
];
var _groqModel=null;
var _groqBadModels={};

async function getGroqModel(){
  if(_groqModel&&!_groqBadModels[_groqModel])return _groqModel;
  for(var i=0;i<GROQ_MODELS.length;i++){
    if(!_groqBadModels[GROQ_MODELS[i]]){_groqModel=GROQ_MODELS[i];return _groqModel;}
  }
  return GROQ_MODELS[0];
}

// geminiCall name ထိန်းသိမ်းထား — codebase တွင်းမှ call တွေ break မဖြစ်အောင်
async function geminiCall(parts,maxTokens,retryCount){
  retryCount=retryCount||0;
  if(retryCount>=GROQ_MODELS.length)throw new Error("All models failed");
  var model=await getGroqModel();
  // parts (Gemini format) → Groq message format
  var msgContent=[];
  parts.forEach(function(p){
    if(p.text){msgContent.push({type:"text",text:p.text});}
    else if(p.inline_data){msgContent.push({type:"image_url",image_url:{url:"data:"+p.inline_data.mime_type+";base64,"+p.inline_data.data}});}
  });
  var r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+AI_KEY},
    body:JSON.stringify({model:model,messages:[{role:"user",content:msgContent}],max_tokens:maxTokens||600,temperature:0.1})
  });
  if(!r.ok){
    var e=await r.json();
    var code=r.status;
    var msg=(e.error&&e.error.message)||"API error "+code;
    if(code===429||code===503||code===404||msg.indexOf("model")>=0){
      _groqBadModels[model]=true;_groqModel=null;
      if(code===429)await new Promise(function(res){setTimeout(res,2000);});
      return geminiCall(parts,maxTokens,retryCount+1);
    }
    throw new Error(msg);
  }
  var d=await r.json();
  return d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"";
}

// Normalize Myanmar number strings (remove commas, spaces)
function normAmt(s){
  if(!s)return 0;
  return parseInt(String(s).replace(/[,\s,၀-၉]/g,function(c){
    var b="၀၁၂၃၄၅၆၇၈၉";var i=b.indexOf(c);return i>=0?i:"";
  }).replace(/[^0-9]/g,""))||0;
}

// Fuzzy name match — checks if receiver name overlaps with payment account name
function fuzzyNameMatch(extracted, expected){
  if(!extracted||!expected)return 0;
  var a=extracted.toLowerCase().replace(/[^a-z0-9\u1000-\u109f]/g," ").trim();
  var b=expected.toLowerCase().replace(/[^a-z0-9\u1000-\u109f]/g," ").trim();
  if(a===b)return 100;
  var wa=a.split(/\s+/);var wb=b.split(/\s+/);
  var match=0;
  wa.forEach(function(w){if(w.length>1&&wb.some(function(x){return x.indexOf(w)>=0||w.indexOf(x)>=0;}))match++;});
  return Math.round(match/Math.max(wa.length,wb.length)*100);
}

// Compute overall confidence score
function computeScore(extracted, order, paymentAccount){
  var scores=[];
  // Amount check (40% weight)
  var exAmt=normAmt(extracted.amount);
  var ordAmt=order.price;
  var amtScore=0;
  if(exAmt>0&&ordAmt>0){
    var diff=Math.abs(exAmt-ordAmt)/ordAmt;
    amtScore=diff<0.01?100:diff<0.05?85:diff<0.1?60:0;
  }
  scores.push({key:"amount",label:"Amount",weight:40,score:amtScore,
    extracted:exAmt>0?exAmt.toLocaleString()+" MMK":"Not found",
    expected:ordAmt.toLocaleString()+" MMK",
    match:amtScore>=85});

  // Receiver name check (35% weight)
  var nameScore=0;
  var expName=paymentAccount||"";
  if(extracted.receiver&&expName){
    nameScore=fuzzyNameMatch(extracted.receiver,expName);
  }
  scores.push({key:"receiver",label:"Receiver",weight:35,score:nameScore,
    extracted:extracted.receiver||"Not found",
    expected:expName||"—",
    match:nameScore>=60});

  // Date check (15% weight)
  var dateScore=0;
  var today=new Date();
  var todayStr=today.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"});
  if(extracted.date){
    var ds=extracted.date.toLowerCase();
    var d=today;
    var yyyymmdd=d.getFullYear()+"-"+(d.getMonth()+1<10?"0":"")+(d.getMonth()+1)+"-"+(d.getDate()<10?"0":"")+d.getDate();
    var ddmm=(d.getDate()<10?"0":"")+d.getDate()+"/"+(d.getMonth()+1<10?"0":"")+(d.getMonth()+1);
    if(ds.indexOf(yyyymmdd)>=0||ds.indexOf(ddmm)>=0||ds.indexOf("today")>=0){dateScore=100;}
    else{
      // Check if date string contains today's day/month numbers
      var dayN=String(d.getDate());var monN=String(d.getMonth()+1);
      if(ds.indexOf(dayN)>=0&&ds.indexOf(monN)>=0)dateScore=70;
      else dateScore=40; // date exists but doesn't match today
    }
  }
  scores.push({key:"date",label:"Date",weight:15,score:dateScore,
    extracted:extracted.date||"Not found",
    expected:"Today ("+todayStr+")",
    match:dateScore>=70});

  // Payment type check (10% weight)
  var typeScore=50; // neutral if can't determine
  var payType=(extracted.paymentType||"").toLowerCase();
  var ordPay=(order.payment||"").toLowerCase();
  if(payType&&ordPay){
    if(ordPay.indexOf("kbz")>=0&&(payType.indexOf("kbz")>=0||payType.indexOf("kpay")>=0))typeScore=100;
    else if(ordPay.indexOf("wave")>=0&&payType.indexOf("wave")>=0)typeScore=100;
    else if(ordPay.indexOf("aya")>=0&&payType.indexOf("aya")>=0)typeScore=100;
    else if(ordPay.indexOf("cb")>=0&&payType.indexOf("cb")>=0)typeScore=100;
    else typeScore=20;
  }
  scores.push({key:"type",label:"Payment Type",weight:10,score:typeScore,
    extracted:extracted.paymentType||"Unknown",
    expected:order.payment||"—",
    match:typeScore>=80});

  // Weighted total
  var total=scores.reduce(function(s,x){return s+x.score*x.weight/100;},0);
  return{total:Math.round(total),fields:scores};
}

// Main AI verify function — called from order detail
async function aiVerifyReceipt(orderIdx, receiptBase64){
  var order=O[orderIdx];
  if(!order){toast("Order not found","er");return;}
  if(!receiptBase64){toast("No receipt image","er");return;}
  if(!AI_KEY){toast("Set AI Key in Settings first","er");return;}

  // Find matching payment account name
  var payAcc=P.find(function(p){return p.n===order.payment;});
  var payHd=payAcc?payAcc.hd:"";

  // Show loading in modal
  var loadEl=document.getElementById("aiVerifyResult");
  if(loadEl){loadEl.innerHTML='<div style="display:flex;align-items:center;gap:8px;padding:12px;background:rgba(0,102,255,.05);border-radius:10px;border:1px solid var(--bd)"><div class="ai-spin"></div><span style="font-size:11px;font-weight:700;color:var(--tx2)">AI is analyzing receipt...</span></div>';}

  var prompt='You are a Myanmar payment receipt OCR extractor. Analyze this payment receipt screenshot carefully.\n\nExtract ONLY these fields in JSON format:\n{\n  "amount": "numeric amount in MMK (numbers only, no commas)",\n  "receiver": "receiver/recipient name exactly as shown",\n  "sender": "sender name if visible",\n  "date": "transaction date as shown",\n  "time": "transaction time if visible",\n  "paymentType": "KBZPay or Wave Pay or AYA Pay or CB Pay or Unknown",\n  "transactionId": "transaction ID/reference number if visible",\n  "status": "Success or Completed or Failed or Unknown"\n}\n\nIMPORTANT:\n- For KBZPay receipts: look for "လက်ခံသူ" (receiver) and "ငွေပမာဏ" (amount)\n- For Wave Pay: look for "Receiver" and "Amount"\n- For AYA Pay: look for recipient name and transfer amount\n- If a field is not visible, use null\n- Return ONLY valid JSON, no other text';

  try{
    var imgData=receiptBase64.split(",")[1]||receiptBase64;
    var raw=await geminiCall([
      {inline_data:{mime_type:"image/jpeg",data:imgData}},
      {text:prompt}
    ],600);
    if(!raw)raw="{}";
    var clean=raw.replace(/```json|```/g,"").trim();
    var extracted={};
    try{extracted=JSON.parse(clean);}catch(pe){
      // Try extract JSON from text
      var m=raw.match(/\{[\s\S]*\}/);
      if(m)try{extracted=JSON.parse(m[0]);}catch(e2){}
    }

    var result=computeScore(extracted,order,payHd);
    renderAIResult(result,extracted,orderIdx,loadEl);

    // Auto actions based on score
    if(result.total>=85){
      // High confidence — auto approve
      if(order.status==="pending"){
        aO(orderIdx,"confirmed");
        toast("Auto-approved ("+result.total+"% match)","ok");
        if(fb&&order.fbId)db.collection("orders").doc(order.fbId).update({aiVerified:true,aiScore:result.total,aiExtracted:extracted,aiVerifiedAt:new Date().toISOString()});
      }
    } else {
      // Low confidence — flag for admin review
      if(fb&&order.fbId)db.collection("orders").doc(order.fbId).update({aiFlag:true,aiScore:result.total,aiExtracted:extracted,aiFlaggedAt:new Date().toISOString()});
      toast("Flagged for review ("+result.total+"%)","in");
    }
  }catch(err){
    var isQuota=err.message&&(err.message.indexOf("quota")>=0||err.message.indexOf("Quota")>=0||err.message.indexOf("429")>=0||err.message.indexOf("exhausted")>=0);
    var errMsg=isQuota
      ?"⚠️ Gemini quota ကုန်သွားပါပြီ။ API key အသစ် သုံးပါ သို့မဟုတ် နောက်မှ ပြန်ကြိုးစားပါ"
      :"AI Error: "+err.message;
    if(loadEl)loadEl.innerHTML='<div style="padding:12px;background:rgba(229,57,53,.06);border-radius:10px;border:1px solid rgba(229,57,53,.15);font-size:11px;color:var(--rd);font-weight:700">'+errMsg+'</div>';
    toast(isQuota?"Quota ကုန်သွားပြီ":"AI check failed","er");
  }
}

function renderAIResult(result,extracted,orderIdx,container){
  if(!container)return;
  var lvl=result.total>=85?"high":result.total>=60?"mid":"low";
  var lvlLabel=result.total>=85?"Verified":result.total>=60?"Review Needed":"Suspicious";
  var lvlColor=result.total>=85?"var(--gn)":result.total>=60?"var(--yw)":"var(--rd)";

  var h='<div class="rcv-score '+lvl+'">'
    +'<div class="sc-ring">'+result.total+'%</div>'
    +'<div><div style="font-size:13px;font-weight:900;color:'+lvlColor+'">'+lvlLabel+'</div>'
    +'<div style="font-size:9px;color:var(--tx3);margin-top:2px">'+(result.total>=85?"Auto-approved by AI":result.total>=60?"Needs admin review":"Possible fake receipt")+'</div></div>'
    +'</div>';

  h+='<div style="background:var(--sf2);border-radius:10px;padding:10px;margin-bottom:8px">';
  result.fields.forEach(function(f){
    var ic=f.match
      ?'<svg viewBox="0 0 24 24" style="width:10px;height:10px;stroke:var(--gn);fill:none;stroke-width:2.5;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>'
      :'<svg viewBox="0 0 24 24" style="width:10px;height:10px;stroke:var(--rd);fill:none;stroke-width:2.5;flex-shrink:0"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    var valColor=f.match?"rf-ok":"rf-no";
    h+='<div class="rcv-field">'
      +'<div class="rf-l">'+f.label+' <span style="font-size:8px;color:var(--tx3)">('+f.weight+'%)</span></div>'
      +'<div class="rf-v '+valColor+'">'+ic+'<span style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+f.extracted+'">'+f.extracted+'</span></div>'
      +'</div>';
  });
  h+='</div>';

  if(extracted.transactionId){
    h+='<div style="font-size:9px;color:var(--tx3);margin-bottom:6px">TxID: <span style="font-family:var(--m);color:var(--ac)">'+extracted.transactionId+'</span></div>';
  }

  // Action buttons
  if(result.total<85){
    h+='<div style="display:flex;gap:6px;margin-top:8px">'
      +'<button class="mb sv" style="font-size:11px;padding:10px" onclick="aO('+orderIdx+',\'confirmed\');cM()">Force Approve</button>'
      +'<button class="mb dl" style="font-size:11px;padding:10px" onclick="aO('+orderIdx+',\'failed\');cM()">Reject</button>'
      +'</div>';
  }
  container.innerHTML=h;
}

var _calY=0,_calM=0,_calSelDate=null;
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function calOpen(){
  var now=new Date();
  _calY=now.getFullYear();_calM=now.getMonth();_calSelDate=null;
  calRender();

  document.getElementById("calOv").classList.add("on");
}

function calMove(d){_calM+=d;if(_calM>11){_calM=0;_calY++;}if(_calM<0){_calM=11;_calY--;}calRender();}
function calRender(){
  var now=new Date();
  document.getElementById("calMonthLbl").textContent=MONTHS[_calM]+" "+_calY;
  var first=new Date(_calY,_calM,1).getDay();
  var daysInMonth=new Date(_calY,_calM+1,0).getDate();
  // Which dates have orders?
  var ordDates={};
  O.forEach(function(o){
    if(o.timestamp){var d=new Date(o.timestamp);if(d.getFullYear()===_calY&&d.getMonth()===_calM){ordDates[d.getDate()]=true;}}
  });
  var h=DAYS.map(function(d){return'<div class="cal-dh">'+d+'</div>';}).join("");
  for(var i=0;i<first;i++)h+='<div class="cal-day empty"></div>';
  for(var day=1;day<=daysInMonth;day++){
    var isToday=day===now.getDate()&&_calM===now.getMonth()&&_calY===now.getFullYear();
    var isFuture=new Date(_calY,_calM,day)>now;
    var isSel=_calSelDate&&_calSelDate.d===day&&_calSelDate.m===_calM&&_calSelDate.y===_calY;
    var cls="cal-day"+(isToday?" today":"")+(isSel?" sel":"")+(ordDates[day]?" has-ord":"")+(isFuture?" future":"");
    h+='<div class="'+cls+'" onclick="calSelect('+day+')">'+day+'</div>';
  }
  document.getElementById("calGrid").innerHTML=h;
}

    h+='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px">';
    h+='<div style="background:var(--sf);border-radius:10px;padding:10px;border:1px solid var(--bd);text-align:center"><div style="font-size:18px;font-weight:900;color:var(--tx)">'+total+'</div><div style="font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase">Orders</div></div>';
    h+='<div style="background:var(--sf);border-radius:10px;padding:10px;border:1px solid var(--bd);text-align:center"><div style="font-size:14px;font-weight:900;color:var(--ac)">'+fmtP(revenue)+'</div><div style="font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase">Revenue</div></div>';
    h+='</div>';
    h+='<div style="display:flex;gap:6px;margin-bottom:8px">';
    h+='<span style="flex:1;padding:5px;border-radius:8px;background:rgba(0,176,92,.1);color:var(--gn);font-size:10px;font-weight:800;text-align:center">✓ '+confirmed.length+' Done</span>';
    h+='<span style="flex:1;padding:5px;border-radius:8px;background:rgba(240,165,0,.1);color:var(--yw);font-size:10px;font-weight:800;text-align:center">⏱ '+pending.length+' Wait</span>';
    h+='<span style="flex:1;padding:5px;border-radius:8px;background:rgba(229,57,53,.1);color:var(--rd);font-size:10px;font-weight:800;text-align:center">✕ '+failed.length+' Fail</span>';
    h+='</div>';
    // Top 3 games that day
    var gCount={};dayOrders.forEach(function(o){gCount[o.game]=(gCount[o.game]||0)+1;});
    var topG=Object.keys(gCount).sort(function(a,b){return gCount[b]-gCount[a];}).slice(0,3);
    if(topG.length){h+='<div style="font-size:9px;font-weight:800;color:var(--tx3);text-transform:uppercase;margin-bottom:4px">Top Games</div>';topG.forEach(function(g){h+='<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.04);font-size:11px"><span style="font-weight:700">'+g+'</span><span style="color:var(--ac);font-weight:800">'+gCount[g]+' orders</span></div>';});}
  }
  var res=document.getElementById("calResult");res.innerHTML=h;res.style.display="block";
}

// ═══ MIDNIGHT AUTO-REFRESH (Dashboard + Orders only) ═══
function schedMidnightRefresh(){
  var now=new Date();
  var msToMidnight=(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,5))-now;
  setTimeout(function(){
    // Only refresh dash+orders — other pages untouched
    if(fb&&db){
      subOrders(); // re-subscribe to get fresh snapshot
      fetchAll(function(){
        rDash();
        if(cp==="orders")rOrd();
        toast("Auto-refreshed at midnight","in");
      });
    }
    schedMidnightRefresh(); // schedule next midnight
  },msToMidnight);
}

// ─── Firebase fetch helpers ───────────────────────────────────────
// onSnapshot အစား get() သုံး → ပိုမြန်, overhead နည်း
// orders သည် onSnapshot ဆက်ထား (new order alert လိုတာကြောင့်)
var _ordUnsub=null;
function fbGet(col,cb){db.collection(col).get().then(function(s){var a=[];s.forEach(function(d){a.push(d.data());});cb(a);}).catch(function(){cb([]);});}
function fbGetQ(col,f,v,cb){db.collection(col).where(f,"==",v).get().then(function(s){var a=[];s.forEach(function(d){a.push(d.data());});cb(a);}).catch(function(){cb([]);});}
// Loading overlay (cnt ထဲ spinner)
function showLoad(){var c=document.getElementById("pg-"+cp);if(c)c.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;gap:12px"><div style="width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite"></div><div style="font-size:11px;color:var(--tx3);font-weight:700">Loading...</div></div>';}
// Manual refresh — tab ပြောင်းတာနဲ့ refresh button နှစ်ခုလုံးသုံး
function fetchAll(cb){
  var done=0,need=6;
  function tick(){if(++done===need&&cb)cb();}
  db.collection("config").doc("store").get().then(function(d){if(d.exists){Object.assign(CFG,d.data());if(CFG.logoImg){var lm=document.querySelector(".logo-mark");if(lm)lm.innerHTML='<img src="'+CFG.logoImg+'" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">';}}tick();}).catch(tick);
  fbGet("games",   function(a){G=a;tick();});
  fbGet("payments",function(a){P=a;tick();});
  fbGet("events",  function(a){EVT=a;tick();});
  fbGet("promos",  function(a){PRM=a;tick();});
  fbGet("giveaways",function(a){GVA=a;tick();});
}
function subOrders(){
  if(_ordUnsub)_ordUnsub();
  _ordUnsub=db.collection("orders").limit(100).onSnapshot(function(s){
    var isFirst=(O.length===0);
    var old=O.length;O=[];
    s.forEach(function(d){var x=d.data();x.fbId=d.id;O.push(x);});
    O.sort(function(a,b){return(b.timestamp||"")>(a.timestamp||"")?1:-1;});
    if(!isFirst&&O.length>old){
      playAlert();
      toast("New order!","in");
      // Auto-verify new orders that have receipt attached
      if(AI_KEY){
        O.forEach(function(o,idx){
          if(o.status==="pending"&&o.receiptUrl&&!o.aiVerified&&!o._aiChecking){
            o._aiChecking=true;
            setTimeout(function(){aiVerifyReceipt(idx,o.receiptUrl);},1500);
          }
        });
      }
    }
    // Dashboard + Orders tab ကို အမြဲ update
    rDash();
    rOrd();
    if(cp==="users")rUsers();
    var bdg=document.getElementById("pBdg");
    if(bdg)bdg.textContent=O.filter(function(o){return o.status==="pending";}).length;
    // LIVE indicator update
    var live=document.getElementById("ordLive");
    if(live)live.style.opacity="1";
    setTimeout(function(){if(live)live.style.opacity=".4";},800);
  },function(){O=[];rDash();});
}
function init(){
  if(!fb){
    document.getElementById("fbDot").style.background="var(--rd)";
    document.getElementById("fbTxt").textContent="Offline";
    G=[];P=[];O=[];rDash();return;
  }
  document.getElementById("fbDot").style.background="var(--gn)";
  document.getElementById("fbTxt").textContent="Connected";
  showLoad(); // spinner ဦးစွာပြ
  fetchAll(function(){rDash();}); // parallel get() — ပြီးမှ render
  subOrders(); // orders သည် real-time ဆက်ထား (new order alert)
  subVerify(); // verifications real-time listener
  subUsers();  // users real-time listener (registered + guest)
  subRegistrations(); // pre-registrations real-time listener
  schedMidnightRefresh(); // midnight auto-refresh စတင်
}
// Refresh button (header မှာ ထည့်ချင်ရင် onclick="manualRefresh()" ခေါ်)
function manualRefresh(){toast("Refreshing...","in");fetchAll(function(){({dash:rDash,orders:rOrd,verify:rVerify,content:rContent,pays:rPay,users:rUsers,set:rSet,register:rRegister})[cp]&&({dash:rDash,orders:rOrd,verify:rVerify,content:rContent,pays:rPay,users:rUsers,set:rSet,register:rRegister})[cp]();toast("Updated","ok");});}
</script></body></html>
